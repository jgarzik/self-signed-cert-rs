[package]
name = "self-signed-cert"
version = "2.0.0"
authors = ["Jeff Garzik"]
edition = "2024"
rust-version = "1.88"
description = "Tool to generate self-signed root CA, web server certs and keys"
license = "MIT"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6", features = ["derive"] }
openssl = "0.10.81"
zip = { version = "8", default-features = false, features = ["deflate", "time"] }

[dev-dependencies]
tempfile = "3.27"
zip = { version = "8", default-features = false, features = ["deflate", "time"] }

[profile.release]
lto = true

# Cargo.toml is the single source of truth for lint levels: CI runs plain
# `cargo clippy`, so local and CI behave identically rather than CI being
# quietly stricter via `-D warnings`.
[lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
